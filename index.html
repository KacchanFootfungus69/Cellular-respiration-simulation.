<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cellular Respiration Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Cellular Respiration</h1>
        <p>Explore how cells convert glucose into ATP.</p>
    </header>

    <main>
        <section class="stage-buttons">
            <button onclick="showStage(0)">1. Glycolysis</button>
            <button onclick="showStage(1)">2. Pyruvate Oxidation</button>
            <button onclick="showStage(2)">3. Krebs Cycle</button>
            <button onclick="showStage(3)">4. ETC</button>
        </section>

        <section class="simulation">
            <div class="molecule">
                <div id="visual">🍬</div>
                <h2 id="stageName">Glycolysis</h2>
                <p id="location">Cytoplasm</p>
            </div>

            <div class="information">
                <h2 id="description">Breaking down glucose</h2>
                <p id="explanation">
                    One glucose molecule is split into
                    two pyruvate molecules.
                </p>

                <h3>Products of this stage</h3>
                <p id="products">2 Pyruvate, 2 ATP (net), 2 NADH</p>

                <button id="nextButton" onclick="nextStage()">
                    Next Stage →
                </button>
            </div>
        </section>

        <section class="energy">
            <h2>Energy Tracker</h2>
            <div class="counters">
                <div>
                    <h3>ATP</h3>
                    <p id="atp">2</p>
                </div>
                <div>
                    <h3>NADH</h3>
                    <p id="nadh">2</p>
                </div>
                <div>
                    <h3>FADH₂</h3>
                    <p id="fadh">0</p>
                </div>
                <div>
                    <h3>CO₂</h3>
                    <p id="co2">0</p>
                </div>
            </div>
        </section>

        <button class="reset" onclick="resetSimulation()">
            Restart Simulation
        </button>
    </main>

    <script src="script.js"></script>
</body>
</html>
